name: Release Build

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual trigger

jobs:
  # macOS + Linux are built and published straight to the draft release by
  # tauri-action. Windows is handled by the separate `release-windows` job so
  # its installers can be code-signed (via SignPath) before they are attached.
  release:
    permissions:
      contents: write
    env:
      TYPST_VERSION: 0.14.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # macOS (x64)
            args: '--target x86_64-apple-darwin'
            typst_dir: 'macos'
            typst_asset: 'typst-x86_64-apple-darwin.tar.xz'
            typst_sha256: '4e91d8e1e33ab164f949c5762e01ee3faa585c8615a2a6bd5e3677fa8506b249'
          - platform: 'macos-latest' # macOS (ARM)
            args: '--target aarch64-apple-darwin'
            typst_dir: 'macos'
            typst_asset: 'typst-aarch64-apple-darwin.tar.xz'
            typst_sha256: '470aa49a2298d20b65c119a10e4ff8808550453e0cb4d85625b89caf0cedf048'
          - platform: 'ubuntu-22.04' # Linux
            args: ''
            typst_dir: 'linux'
            typst_asset: 'typst-x86_64-unknown-linux-musl.tar.xz'
            typst_sha256: 'a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # For macOS cross-compilation
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Typst binary
        if: matrix.typst_dir != ''
        shell: bash
        run: |
          set -euo pipefail
          DEST="src-tauri/bin/typst/${{ matrix.typst_dir }}"
          TMP="$(mktemp -d)"
          ARCHIVE="$TMP/typst.tar.xz"
          mkdir -p "$DEST"
          curl -fsSL -o "$ARCHIVE" "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/${{ matrix.typst_asset }}"

          EXPECTED="$(echo "${{ matrix.typst_sha256 }}" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$EXPECTED" ]; then
            echo "Missing expected SHA256 for ${{ matrix.typst_asset }}" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL="$(sha256sum "$ARCHIVE" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          else
            ACTUAL="$(shasum -a 256 "$ARCHIVE" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "SHA256 mismatch for ${{ matrix.typst_asset }}" >&2
            echo "Expected: $EXPECTED" >&2
            echo "Actual:   $ACTUAL" >&2
            exit 1
          fi

          tar -xJf "$ARCHIVE" -C "$TMP"
          SRC_DIR="$(find "$TMP" -maxdepth 1 -type d -name 'typst*' -print -quit)"
          if [ -z "$SRC_DIR" ]; then
            echo "Failed to locate extracted Typst directory" >&2
            exit 1
          fi
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$SRC_DIR"/. "$DEST"/
          chmod +x "$DEST/typst"

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # Use the tag name as release name
          releaseName: 'Tideflow ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeRelease: true
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: List produced bundles
        run: |
          echo "Listing src-tauri/target/release/bundle"
          ls -la src-tauri/target/release/bundle || true

  # Windows is built unsigned, then the installers are code-signed by SignPath
  # (free for open-source projects) and the signed files are attached to the
  # same draft release created above.
  #
  # `needs: release` + `if: always()` guarantees this job starts AFTER the
  # macOS/Linux job has created the draft release (avoiding a duplicate-release
  # race), while `always()` still lets Windows run even if a mac/linux leg fails.
  #
  # Signing only activates once you configure the SignPath repository
  # variables/secret (see .github/WORKFLOWS.md > "Windows code signing").
  # Until then the job publishes UNSIGNED installers with a warning, so the
  # release pipeline keeps working during setup.
  release-windows:
    needs: release
    if: ${{ always() }}
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # Omitting tagName/releaseName makes tauri-action build only (no release
      # upload). The Windows Typst binary is vendored in the repo, so no
      # download step is needed here.
      - name: Build the app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          includeUpdaterJson: false

      - name: List produced bundles
        shell: pwsh
        run: |
          Write-Host "Listing src-tauri/target/release/bundle"
          Get-ChildItem -Path src-tauri\target\release\bundle -Recurse -Include *.msi,*-setup.exe -ErrorAction SilentlyContinue | Format-List

      # Bundle the unsigned installers into one workflow artifact that SignPath
      # will pull, sign, and hand back.
      - name: Upload unsigned installers
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: tideflow-windows-unsigned
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # ---- Signed path: runs only when SignPath is configured ----
      - name: Sign installers (SignPath)
        id: signpath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Publish SIGNED installers to the release
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Tideflow ${{ github.ref_name }}'
          draft: true
          files: |
            signed/**/*.msi
            signed/**/*.exe

      # ---- Fallback: SignPath not configured yet ----
      - name: Publish UNSIGNED installers to the release (SignPath not configured)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Tideflow ${{ github.ref_name }}'
          draft: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Warn that the Windows build is unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        shell: pwsh
        run: |
          Write-Warning "SignPath is not configured (repo variable SIGNPATH_ORGANIZATION_ID is empty)."
          Write-Warning "Windows installers were published UNSIGNED and will trigger SmartScreen."
          Write-Warning "See .github/WORKFLOWS.md > 'Windows code signing' to finish setup."
